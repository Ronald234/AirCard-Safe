name: Pass artwork research
on:
  push:
    branches: ['research/pass-artwork']
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rust tools
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full research tests
        run: cargo test --locked --manifest-path research/recovery-store/Cargo.toml
      - name: Format
        run: cargo fmt --manifest-path research/recovery-store/Cargo.toml -- --check
      - name: Static checks
        run: cargo clippy --locked --manifest-path research/recovery-store/Cargo.toml --all-targets -- -D warnings
      - name: Release library build
        run: cargo build --locked --release --manifest-path research/recovery-store/Cargo.toml
