name: AirCard Safe Windows
on:
  push:
    branches: ['aircard-safe', 'main', 'master']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -Vv
          cargo -V
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Unit and integration tests
        shell: pwsh
        run: |
          cargo test --locked 2>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release build with static CRT
        shell: pwsh
        run: |
          cargo build --locked --release 2>&1 | Tee-Object -FilePath cargo-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PE verifier regression tests
        shell: pwsh
        run: ./scripts/test-verify-pe.ps1
      - name: Verify binary and smoke test without an iPhone
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target/release/AirCard-Safe.exe').Path
          $pe = ./scripts/verify-pe.ps1 -Path $exe
          $check = Start-Process -FilePath $exe -ArgumentList '--self-check' -Wait -PassThru -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw 'Self-check failed' }
          $gui = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 5
            if ($gui.HasExited) { throw 'GUI exited during launch smoke test' }
          } finally {
            if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force }
          }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -LiteralPath $exe -Destination dist/AirCard-Safe.exe
          "$($pe.SHA256)  AirCard-Safe.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          @{
            commit=$env:GITHUB_SHA; runner=$env:RUNNER_OS; rust=(rustc -V | Out-String).Trim()
            binary=$pe; self_check='passed'; launch_smoke='passed'
            iphone_physical_test='NOT PERFORMED'; windows10_physical_test='NOT PERFORMED'
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 dist/build-info.json
          Copy-Item LICENSE, README.md, cargo-test.log, cargo-build.log -Destination dist
          Copy-Item docs/TESTING.md -Destination dist/TESTING.md
          "Artifact contains AirCard-Safe.exe and its SHA-256. Physical iPhone operation has not been tested." >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $($pe.SHA256)" >> $env:GITHUB_STEP_SUMMARY
      - name: Publish executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AirCard-Safe-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30

