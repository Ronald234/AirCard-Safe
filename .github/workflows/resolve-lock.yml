name: Resolve renderer lockfile
on:
  push:
    branches: ['aircard-safe']
    paths: ['.github/workflows/resolve-lock.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve dependency graph without building
        shell: pwsh
        run: |
          cargo metadata --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes('Cargo.lock'))
          Write-Output 'LOCKBEGIN'
          for ($offset=0; $offset -lt $encoded.Length; $offset+=4000) {
            Write-Output ('LOCKCHUNK:' + $encoded.Substring($offset,[Math]::Min(4000,$encoded.Length-$offset)))
          }
          Write-Output 'LOCKEND'
          Get-FileHash Cargo.lock -Algorithm SHA256
