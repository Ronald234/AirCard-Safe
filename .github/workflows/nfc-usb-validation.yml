name: NFC USB research checks (no application build)
on:
  push:
    branches: ['research/nfc-usb']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancel-premature-build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel previously queued executable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/Ronald234/AirCard-Safe/actions/runs/42943905367/cancel
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Format
        run: cargo fmt --all -- --check
      - name: Type checking without linking the application
        run: cargo check --locked --all-targets
      - name: Correctness analysis without linking the application
        run: cargo clippy --locked --all-targets -- -D clippy::correctness
